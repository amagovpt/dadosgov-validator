services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataset_validation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    build: .
    command: flask db upgrade
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataset_validation
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  flask:
    build: .
    command: python -m debugpy --listen 0.0.0.0:5678 -m flask run --host=0.0.0.0 --port=5000 --no-debugger --no-reload
    ports:
      - "5000:5000"
      - "5678:5678"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataset_validation
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  celery_worker:
    build: .
    command: python -m debugpy --listen 0.0.0.0:5679 -m celery -A run.celery worker --loglevel=info
    ports:
      - "5679:5679"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataset_validation
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  uploads:
  postgres_data: